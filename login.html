<!DOCTYPE html>
<html >
<head>
    <title>Outfit Planner - Log In</title>

    <!-- CSS Link -->
    <link rel="stylesheet" href="login.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
               
    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/0fc67ac136.js" crossorigin="anonymous"></script>
</head>
<body>

    <header class="header">
        <div class="navigation_logo">
           <p><img src="OP Logo.png" width="100px" alt="Outfit Planner Logo"/>Outfit Planner</p> 
        </div>
        <nav>
            <button><a href="#"><i class="fa-solid fa-graduation-cap"></i> Student Beta</a></button>
            <a href="#"><i class="fa-regular fa-circle-question"></i> Help</a>
        </nav>
    </header>

    <section class="body">
        
        <!-- Centered Form Card -->
        <section class="login-info">
            
            <div id="welcome">
                <div class="logo-box">
                    <img src="OP Logo.png" width="50px" alt="Logo">
                </div>
                <h1>Welcome Back!</h1>
                <h3>Plan your look. Organize your wardrobe.</h3>
            </div>

            <form>
                <!-- Email -->
                <div class="form-box">
                    <div class="form-label">
                        <label for="email">Email or Username</label> 
                    </div>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="sophia.taylor@nyu.edu"
                        required 
                    >
                </div>

                <!-- Password -->
                <div class="form-box">
                    <div class="form-label">
                        <label for="password">Password</label>
                        <a href="forgot_password.html">Forgot Password?</a>
                    </div>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="••••••••••••"
                        required
                    >
                </div>

                <!-- Checkbox -->
                <div class="checkbox-group">
                    <input type="checkbox" id="remember" checked>
                    <label for="remember">Remember me for 30 days</label>
                </div>

                <!-- Log In Button -->
                <button type="submit" class="login-btn">
                    <a href="home.html" style="text-decoration: none;">Log In <i class="fa-solid fa-arrow-right"></i></a>
                </button>

                <!-- Divider -->
                <div class="divider">
                    <span>or continue with</span>
                </div>

                <!-- SSO Buttons -->
                <div class="sso-buttons">
                    <button id="btn" type="button"><i class="fa-solid fa-graduation-cap"></i> Campus Portal</button>
                    <button id="btn" type="button"><i class="fa-brands fa-google"></i> Google Account</button>
                </div>

                <!-- Sign Up Link -->
                <div class="sign-up">
                    <p>Don't have an account? <a href="signUp.html">Sign Up</a></p> 
                </div>

            </form>
        </section>
    </section>

    <footer class="footer">
        <p>© 2026 Outfit Planner. Designed for effortless daily styling.</p>
        <div id="footer-div">
            <p><a href="#">Privacy Policy</a></p>
            <p><a href="#">Terms of Service</a></p>
            <p><a href="#">Closet Care Guide</a></p>
            <p><a href="#">Help & Feedback</a></p>
        </div>
    </footer>

</body>
</html>





























</html>
